name: model smoke (slow)
# Реальные тесты на LLM (загрузка QVikhr/RusMind, ответы модели, system, ablation).
# Требует self-hosted runner с меткой `models` и скачанными GGUF в data/models/.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"  # еженедельно, воскресенье 03:00 UTC
permissions: { contents: read }
jobs:
  smoke:
    runs-on: [self-hosted, models]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest -m slow -q
