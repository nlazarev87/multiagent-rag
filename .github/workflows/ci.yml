name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
jobs:
  test:
    name: pytest (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - run: python -m compileall -q src/
      - run: pytest -m "not slow and not holdout" -q
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt
      - name: ruff check
        run: ruff check src/ tests/
      - name: mypy src/
        run: mypy src/
  pr-lint:
    name: pr-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить связь PR с issue и вехой
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if ! echo "$BODY" | grep -Eq '(Closes|Fixes|Resolves)[[:space:]]+#[0-9]+'; then
            echo "::error::В PR нет ссылки на issue (Closes/Fixes/Resolves #N)."
            exit 1
          fi
          if ! echo "$BODY" | grep -Eq 'Milestone:'; then
            echo "::error::В PR нет строки 'Milestone:'."
            exit 1
          fi
          echo "PR связан с issue и вехой."
