<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Документы</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; }
    #shell { flex: 1; min-height: 0; height: auto; }
    body {
      /* Раскладка */
      --left: 260px;
      --mid: 380px;
      /* Нейтральная шкала */
      --chrome: #ECECEF;
      --panel: #F6F6F8;
      --editor: #FFFFFF;
      --sink: #F0F0F3;
      --fg: #1B1B1F;
      --fg2: #5B5B66;
      --fg3: #8A8A96;
      --fg4: #B6B6C0;
      --line: #E1E1E6;
      --line2: #ECECF0;
      --line3: #D4D4DB;
      --wash: rgba(20,20,28,.055);
      --focus: rgba(20,20,28,.10);
      --focus-ring: rgba(79,70,229,.28);
      /* Акцент и семантика */
      --link: #2B59C3;
      --btn: #4F46E5;
      --btn-hover: #4338CA;
      --accent: #4F46E5;
      --accent-hover: #4338CA;
      --accent-soft: #EEF1FF;
      --accent-soft-2: #E0E6FF;
      --ready: #159A4D;
      --ready-soft: #EAF7EF;
      --hit: rgba(255,214,90,.38);
      --danger: #D9392F;
      --danger-soft: #FBEDEB;
      --warn: #B9780C;
      --warn-soft: #FBF3E2;
      /* Радиусы */
      --r-1: 4px;
      --r-2: 6px;
      --r-3: 8px;
      --r-4: 12px;
      /* Тени */
      --shadow-1: 0 1px 2px rgba(20,20,28,.05);
      --shadow-2: 0 2px 10px rgba(20,20,28,.07);
      --shadow-3: 0 12px 36px rgba(20,20,28,.16);
      background: var(--chrome);
      color: var(--fg);
      font-family: "Segoe UI Variable Text", "Segoe UI", "Segoe WPC", system-ui, sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;
    }
    .shell {
      display: grid;
      grid-template-columns: var(--left) 1px var(--mid) 1px minmax(0, 1fr);
      height: 100%;
      min-height: 0;
    }
    .pane {
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--chrome);
    }
    .editor { background: var(--editor); }
    .sash {
      position: relative;
      background: var(--line);
      cursor: col-resize;
      z-index: 2;
    }
    .sash:hover, .sash.drag { background: var(--accent); }
    .sash::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -2px;
      width: 4px;
    }
    button {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 0;
      border-radius: 8px;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .hidden { display: none !important; }
    .side-head { padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 8px; }
    .side-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--fg3);
    }
    #manage {
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 2px 7px;
      border-radius: var(--r-1);
    }
    #manage:hover { background: var(--accent-soft); }
    #fresh {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 30px;
      padding: 0 13px;
      background: var(--accent);
      color: #fff;
      border-radius: var(--r-2);
      font-weight: 600;
      font-size: 12.5px;
    }
    #fresh:hover { background: var(--accent-hover); }
    #chats {
      list-style: none;
      margin: 4px 6px 0;
      padding: 0;
      flex: 1;
      overflow: auto;
    }
    #chats li {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 0 9px;
      border-radius: var(--r-2);
      color: var(--fg2);
    }
    #chats li:hover { background: var(--wash); color: var(--fg); }
    #chats li.on { background: var(--accent-soft); color: var(--fg); }
    #chats li.on::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 auto;
    }
    #chats .title {
      flex: 1;
      text-align: left;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding: 0;
      border-radius: 0;
    }
    #chats .kill {
      width: 22px;
      height: 22px;
      color: var(--fg3);
      opacity: 0;
      display: grid;
      place-items: center;
      font-size: 14px;
      line-height: 1;
    }
    #chats li:hover .kill, #chats .kill:focus { opacity: 1; }
    #chats .kill:hover { color: var(--danger); background: var(--focus); }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7A7A88;
      flex-shrink: 0;
    }
    .dot.on { background: #3FBF6F; }
    #readiness { margin: 0; }
    .side-foot {
      flex: 0 0 auto;
      border-top: 1px solid var(--line-2);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: var(--r-2);
      background: var(--paper);
      border: 1px solid var(--line-2);
    }
    .user-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8B5CF6);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }
    .user-meta { min-width: 0; line-height: 1.2; display: flex; flex-direction: column; }
    .user-name { font-size: 12px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .user-role { font-size: 11px; color: var(--fg3); }
    .user-actions { margin-left: auto; display: flex; gap: 2px; }
    .ui-icon {
      width: 26px;
      height: 26px;
      border-radius: var(--r-2);
      display: grid;
      place-items: center;
      color: var(--fg3);
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .ui-icon:hover { background: var(--wash); color: var(--fg); }
    .ui-icon svg { width: 15px; height: 15px; }
    .mid-head {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 4px 10px;
    }
    .seg { display: flex; gap: 12px; }
    .seg button { height: 22px; color: var(--fg2); font-size: 12px; border-radius: 0; }
    .seg button.on { color: var(--fg); font-weight: 500; }
    .docs-tools { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    #find-toggle, #upload {
      width: 26px;
      height: 26px;
      color: var(--fg2);
      display: grid;
      place-items: center;
      border-radius: var(--r-2);
    }
    #find-toggle:hover, #upload:hover { background: var(--wash); color: var(--fg); }
    #find {
      width: 9.5rem;
      height: 26px;
      padding: 0 8px;
      border: 1px solid var(--line3);
      border-radius: var(--r-2);
      background: var(--editor);
      color: var(--fg);
      font: inherit;
      outline: none;
    }
    #find:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
    #find::placeholder { color: var(--fg4); }
    #files { display: none; }
    .mid-body {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #agent-pane, #docs-pane {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    #log { flex: 1; overflow: auto; }
    .turn {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 14px;
    }
    .question {
      align-self: flex-end;
      max-width: 88%;
      background: var(--accent);
      color: #fff;
      border-radius: 14px 14px 4px 14px;
      padding: 8px 13px;
      font-size: 13px;
    }
    .a { display: flex; gap: 10px; }
    .a-avatar {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--paper-2);
      border: 1px solid var(--line-2);
      color: var(--accent);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: 14px;
    }
    .a-body { min-width: 0; display: flex; flex-direction: column; gap: 9px; }
    .a-text { white-space: pre-wrap; line-height: 1.55; font-size: 13.5px; }
    .rate {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--fg3);
    }
    .rate-label { min-width: 11.5rem; }
    .n {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      color: var(--fg3);
    }
    .n.on { background: var(--focus); color: var(--fg); font-weight: 500; }
    .n:hover { background: var(--wash); color: var(--fg); }
    .source-block { display: flex; flex-direction: column; gap: 4px; }
    .chip {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--paper-2);
      border: 1px solid var(--line-2);
      color: var(--link);
      font-size: 12px;
    }
    .chip:hover { background: var(--accent-soft); border-color: var(--accent-soft-2); }
    #ask {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin: 8px 12px 12px;
      padding: 9px 9px 9px 14px;
      border: 1px solid var(--line3);
      border-radius: var(--r-4);
      background: var(--editor);
      box-shadow: var(--shadow-2);
      transition: border-color .12s, box-shadow .12s;
    }
    #ask:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    #query {
      flex: 1;
      min-height: 36px;
      max-height: 88px;
      border: 0;
      resize: none;
      outline: none;
      font: inherit;
      background: transparent;
      color: var(--fg);
    }
    #query::placeholder { color: var(--fg4); }
    #send {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: var(--btn);
      color: var(--editor);
    }
    #send:hover { background: var(--btn-hover); }
    #tree { list-style: none; margin: 4px 0 0; padding: 0 8px; flex: 1; min-height: 0; overflow: auto; }
    #tree-tail { flex: 0 0 28px; min-height: 28px; }
    #tree ul { list-style: none; margin: 0; padding: 0 0 0 14px; }
    .node {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-height: 24px;
      padding: 0 6px;
      border-radius: 8px;
      color: var(--fg2);
      text-align: left;
    }
    .node:hover, .node.on { background: var(--wash); color: var(--fg); }
    .node.drop { background: var(--focus); }
    .node .chev { width: 12px; color: var(--fg4); flex: 0 0 auto; display: grid; place-items: center; font-size: 11px; }
    .node .fico { width: 14px; height: 14px; flex: 0 0 auto; color: var(--fg3); }
    .node.folder .fico { color: var(--warn); }
    .node .fname {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 12.5px;
    }
    .node.folder .fname { font-weight: 500; color: var(--fg); }
    .node mark { background: var(--hit); color: inherit; border-radius: 2px; padding: 0 1px; }
    .node input {
      flex: 1;
      min-width: 0;
      height: 22px;
      border: 1px solid var(--line3);
      border-radius: 4px;
      font: inherit;
      padding: 0 6px;
    }
    .menu {
      position: absolute;
      min-width: 10.5rem;
      padding: 4px;
      background: var(--editor);
      border: 1px solid var(--line2);
      border-radius: 8px;
      box-shadow: 0 8px 24px #14141424;
      z-index: 5;
    }
    .menu button {
      display: block;
      width: 100%;
      text-align: left;
      height: 26px;
      padding: 0 8px;
    }
    .menu button:hover { background: var(--wash); }
    #steps { padding: 0 10px 8px; font-size: 12px; color: var(--fg3); }
    .tabs {
      display: flex;
      align-items: stretch;
      min-height: 35px;
      background: var(--chrome);
      overflow-x: auto;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 16rem;
      padding: 0 9px 0 12px;
      height: 34px;
      color: var(--fg3);
      background: var(--chrome);
      flex-shrink: 0;
      border-radius: 0;
      cursor: pointer;
      border-top: 2px solid transparent;
      border-right: 1px solid var(--line-2);
    }
    .tab.on { background: var(--editor); color: var(--fg); border-top-color: var(--accent); }
    .tab span {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .tab .x {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      color: var(--fg3);
    }
    .tab .x:hover { background: var(--focus); color: var(--fg); }
    .preview-head {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 12px 22px 10px;
      border-bottom: 1px solid var(--line-2);
      background: var(--editor);
    }
    .preview-title {
      font-size: 15px;
      font-weight: 600;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .preview-sub { font-size: 12px; color: var(--fg3); }
    .canvas { flex: 1; overflow: auto; padding: 16px 26px 40px; background: var(--editor); }
    .paper.idle { color: var(--fg3); }
    .muted { margin: 24px 0 0; color: var(--fg3); font-size: 12px; }
    .chunk { margin: 0; max-width: 760px; }
    .chunk p {
      margin: 0 0 12px;
      font-size: 13.5px;
      line-height: 1.65;
      padding: 3px 6px;
      border-radius: var(--r-2);
    }
    .chunk p.hit { background: var(--hit); box-shadow: inset 2px 0 0 var(--warn); }
    .file { margin: 4px 0; }
    #gate, #admin, #pick {
      position: fixed;
      inset: 0;
      background: var(--chrome);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    #admin { align-items: stretch; justify-content: stretch; }
    .card {
      width: min(420px, calc(100% - 32px));
      background: var(--editor);
      border: 1px solid var(--line2);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card input, .admin-body input, .admin-body select {
      font: inherit;
      color: inherit;
      background: var(--chrome);
      border: 1px solid var(--line2);
      border-radius: 6px;
      padding: 6px 8px;
    }
    .card button, .text-btn {
      font: inherit;
      background: var(--btn);
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }
    #status {
      position: relative;
      z-index: 6;
      height: 28px;
      flex: 0 0 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 10px;
      background: #26262E;
      border-top: 1px solid var(--line);
      color: #E8E8EE;
      font-size: 12px;
    }
    #status .sb-spacer { flex: 1; }
    #status .sb-sep { width: 1px; height: 14px; background: rgba(255,255,255,.22); }
    #status button {
      border: 0;
      background: transparent;
      color: #E8E8EE;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      padding: 2px 7px;
      border-radius: var(--r-1);
    }
    #status button:hover { background: rgba(255,255,255,.14); }
    .admin-body { flex: 1; overflow: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .admin-head { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid var(--line); }
    .access-block { border: 1px solid var(--line2); border-radius: 8px; background: var(--editor); }
    .access-block > summary {
      cursor: pointer;
      font-weight: 500;
      padding: 8px 12px;
      position: sticky;
      top: 0;
      background: var(--editor);
      z-index: 1;
    }
    .access-tools { padding: 0 12px 8px; }
    .access-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      padding: 6px 12px;
      border-top: 1px solid var(--line);
    }
    .access-row .access-state { margin: 0; min-width: 12rem; flex: 1 1 10rem; }
    .access-row label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  </style>
</head>
<body>
  <form id="gate" class="hidden">
    <div class="card">
      <p id="gate-title">Вход</p>
      <input id="gate-login" autocomplete="username" placeholder="Логин" aria-label="Логин">
      <input id="gate-password" type="password" autocomplete="current-password" placeholder="Пароль" aria-label="Пароль">
      <button id="gate-submit" class="text-btn" type="submit">Войти</button>
      <p id="gate-error"></p>
    </div>
  </form>
  <section id="admin" class="hidden" aria-label="Управление">
    <div class="admin-head">
      <button type="button" id="admin-users" class="text-btn">Люди</button>
      <button type="button" id="admin-roles" class="text-btn">Роли</button>
      <button type="button" id="admin-groups" class="text-btn">Группы</button>
      <button type="button" id="admin-access" class="text-btn">Доступы</button>
      <button type="button" id="admin-audit" class="text-btn">Журнал</button>
      <button type="button" id="admin-close" class="text-btn">Закрыть</button>
    </div>
    <div id="admin-body" class="admin-body"></div>
  </section>
  <main class="shell" id="shell">
    <aside class="pane" aria-label="Диалоги">
      <div class="side-head">
        <div class="side-title"><span>Диалоги</span><button id="manage" type="button" class="hidden">Управление</button></div>
        <button id="fresh" type="button">Новый диалог</button>
      </div>
      <ul id="chats"></ul>
      <div class="side-foot">
        <div class="user-chip">
          <span class="user-avatar" id="user-avatar"></span>
          <span class="user-meta"><span class="user-name" id="user-name"></span><span class="user-role" id="user-role-label"></span></span>
          <span class="user-actions">
            <button class="ui-icon" id="status-password" title="Сменить пароль" aria-label="Сменить пароль"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
            <button class="ui-icon" id="status-out" title="Выйти" aria-label="Выйти"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
          </span>
        </div>
      </div>
    </aside>
    <div class="sash" id="sash-left" role="separator" aria-orientation="vertical" aria-label="Граница диалогов"></div>
    <section class="pane" aria-label="Агент">
      <div class="mid-head">
        <div class="seg" role="tablist" aria-label="Режим">
          <button type="button" id="mode-agent" class="on" role="tab" aria-selected="true">Agent</button>
          <button type="button" id="mode-docs" role="tab" aria-selected="false">Документы</button>
        </div>
        <div class="docs-tools hidden" id="docs-tools">
          <input id="find" class="hidden" type="search" placeholder="Поиск документа" aria-label="Поиск документа">
          <button id="find-toggle" type="button" aria-label="Поиск" aria-expanded="false">⌕</button>
          <button id="upload" type="button" aria-label="Загрузить">↑</button>
          <input id="files" type="file" multiple accept=".txt,.md,.doc,.docx">
        </div>
      </div>
      <div class="mid-body">
        <div id="agent-pane">
          <div id="log"></div>
          <form id="ask">
            <textarea id="query" required placeholder="Спросить по документам"></textarea>
            <button id="send" type="submit" aria-label="Спросить">→</button>
          </form>
        </div>
        <div id="docs-pane" class="hidden">
          <ul id="tree"></ul>
          <div id="tree-tail"></div>
          <div id="steps"></div>
          <div id="menu" class="menu hidden" role="menu"></div>
        </div>
      </div>
    </section>
    <div class="sash" id="sash-right" role="separator" aria-orientation="vertical" aria-label="Граница документа"></div>
    <section class="pane editor" aria-label="Документ">
      <div class="tabs" id="tabs"></div>
      <div class="preview-head" id="preview-head">
        <div class="preview-title" id="preview-title"></div>
        <div class="preview-sub" id="preview-sub"></div>
      </div>
      <div class="canvas">
        <div id="preview" class="paper idle"></div>
      </div>
    </section>
  </main>
  <footer id="status" class="hidden"><span class="dot" id="ready-dot"></span><span id="readiness">Модель загружается…</span><span class="sb-spacer"></span><span id="status-login"></span><span id="status-role"></span></footer>
  <script>
    const shell = document.getElementById("shell");
    const chatsEl = document.getElementById("chats");
    const log = document.getElementById("log");
    const tabsEl = document.getElementById("tabs");
    const preview = document.getElementById("preview");
    const treeEl = document.getElementById("tree");
    const menu = document.getElementById("menu");
    const find = document.getElementById("find");
    const files = document.getElementById("files");
    const steps = document.getElementById("steps");
    const query = document.getElementById("query");
    const ask = document.getElementById("ask");
    const send = document.getElementById("send");
    const readiness = document.getElementById("readiness");
    const readyDot = document.getElementById("ready-dot");
    const agentPane = document.getElementById("agent-pane");
    const docsPane = document.getElementById("docs-pane");
    const docsTools = document.getElementById("docs-tools");
    const modeAgent = document.getElementById("mode-agent");
    const modeDocs = document.getElementById("mode-docs");

    let systemReady = false;
    let uiLoaded = false;
    let treeFresh = false;
    let dialogs = [];
    let dialogId = "";
    let tree = { id: "root", name: "", children: [] };
    let filter = "";
    let openTabs = [];
    let activeTab = "";
    let tabChunks = {};
    let previewToken = 0;
    let menuTarget = null;
    let closedFolders = new Set();
    let treeStamp = 0;
    let treePending = false;
    let treeDragging = false;
    let treeWriting = false;
    let me = null;
    let fileBase = {};

    function field(parent, tag, text, className) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      parent.append(node);
      return node;
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function tokens(text) {
      return new Set(String(text || "").toLowerCase().replace(/ё/g, "е").match(/[0-9a-zа-я]+/g) || []);
    }

    function contentWords(text) {
      return new Set([...tokens(text)].filter((word) => word.length >= 5));
    }

    function coverage(answer, paragraph) {
      const have = contentWords(paragraph);
      let score = 0;
      for (const word of contentWords(answer)) if (have.has(word)) score += 1;
      return score;
    }

    function blocks(text) {
      return String(text || "").split(/\n+/).map((line) => line.trim()).filter(Boolean);
    }

    function bindSash(sash, prop, min, max) {
      sash.addEventListener("mousedown", (event) => {
        event.preventDefault();
        const startX = event.clientX;
        const start = parseInt(getComputedStyle(document.body).getPropertyValue(prop), 10);
        sash.classList.add("drag");
        function move(moveEvent) {
          const next = Math.min(max, Math.max(min, start + (moveEvent.clientX - startX)));
          document.body.style.setProperty(prop, next + "px");
        }
        function up() {
          sash.classList.remove("drag");
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", up);
        }
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      });
    }

    bindSash(document.getElementById("sash-left"), "--left", 200, 480);
    bindSash(document.getElementById("sash-right"), "--mid", 280, 640);

    function current() {
      return dialogs.find((row) => row.id === dialogId) || null;
    }

    function paintChats() {
      chatsEl.replaceChildren();
      dialogs.forEach((row) => {
        const item = element("li", row.id === dialogId ? "on" : "");
        const open = element("button", "title", row.title || "Новый диалог");
        open.type = "button";
        open.addEventListener("click", () => selectDialog(row.id));
        const kill = element("button", "kill", "×");
        kill.type = "button";
        kill.setAttribute("aria-label", "Удалить диалог");
        kill.addEventListener("click", (event) => {
          event.stopPropagation();
          removeDialog(row.id);
        });
        item.append(open, kill);
        chatsEl.append(item);
      });
    }

    function idlePreview() {
      preview.classList.add("idle");
      preview.replaceChildren(element("p", "muted", "Откройте документ из чата или из дерева."));
      if (document.getElementById) {
        const headTitle = document.getElementById("preview-title");
        const headSub = document.getElementById("preview-sub");
        if (headTitle) headTitle.textContent = "";
        if (headSub) headSub.textContent = "";
      }
    }

    function paintTabs() {
      function tabParts(key) {
        const text = String(key || "");
        const mark = text.indexOf(":");
        const head = mark > 0 ? text.slice(0, mark) : "";
        if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(head)) {
          return { kbId: head, name: text.slice(mark + 1) };
        }
        return { kbId: "", name: text };
      }
      tabsEl.replaceChildren();
      openTabs.forEach((key) => {
        const parts = tabParts(key);
        const tab = element("div", key === activeTab ? "tab on" : "tab");
        tab.append(element("span", "", parts.name));
        tab.addEventListener("click", () => showPreview(parts.name, null, parts.kbId));
        const close = element("button", "x", "×");
        close.type = "button";
        close.setAttribute("aria-label", "Закрыть вкладку");
        close.addEventListener("click", (event) => {
          event.stopPropagation();
          closeTab(key);
        });
        tab.append(close);
        tabsEl.append(tab);
      });
    }

    function closeTab(name) {
      openTabs = openTabs.filter((item) => item !== name);
      delete tabChunks[name];
      if (activeTab === name) activeTab = openTabs[0] || "";
      paintTabs();
      if (!activeTab) {
        idlePreview();
        return;
      }
      paintChunks(tabChunks[activeTab] || [], {});
    }

    function paintChunks(chunks, where) {
      where = where || {};
      if (document.getElementById) {
        const headTitle = document.getElementById("preview-title");
        const headSub = document.getElementById("preview-sub");
        if (headTitle) headTitle.textContent = (chunks.length && chunks[0].document_name) || "";
        if (headSub) headSub.textContent = chunks.length ? chunks.length + " фрагментов" : "";
      }
      let target = -1;
      if (where.chunkIndex !== undefined && where.chunkIndex !== "") {
        const want = Number(where.chunkIndex);
        target = chunks.findIndex((chunk) => Number(chunk.chunk_index) === want);
      } else if (where.section) {
        target = chunks.findIndex((chunk) => chunk.section === where.section);
      }
      let best = { score: 0, chunk: -1, part: -1 };
      if (where.answer) {
        chunks.forEach((chunk, index) => {
          blocks(chunk.text).forEach((part, place) => {
            const score = coverage(where.answer, part);
            if (score < 1) return;
            const inTarget = index === target;
            const bestOutside = best.chunk !== target;
            if (score > best.score || (score === best.score && inTarget && bestOutside)) {
              best = { score, chunk: index, part: place };
            }
          });
        });
      }
      preview.classList.remove("idle");
      preview.replaceChildren(...chunks.map((chunk, index) => {
        const article = element("article", "chunk");
        article.setAttribute("data-index", String(chunk.chunk_index));
        if (chunk.section) article.title = chunk.section;
        for (const [place, part] of blocks(chunk.text).entries()) {
          const hit = best.score > 0 && index === best.chunk && place === best.part;
          article.append(element("p", hit ? "hit" : "", part));
        }
        return article;
      }));
      const marked = preview.querySelector(".hit");
      if (marked) {
        marked.scrollIntoView({ block: "center" });
        return;
      }
      if (target >= 0) {
        const article = preview.querySelector("[data-index=\"" + chunks[target].chunk_index + "\"]");
        if (article) {
          article.scrollIntoView({ block: "start" });
          return;
        }
      }
      preview.parentNode.scrollTop = 0;
    }

    async function lookupBases(name) {
      try {
        const response = await fetch("/documents", { signal: AbortSignal.timeout(8000) });
        if (!response.ok) return [];
        const data = await response.json().catch(() => ({}));
        return (data.documents || []).filter((item) => item && item.name === name && item.kb_id);
      } catch (error) {
        return [];
      }
    }

    async function showPreview(name, where, kbId) {
      if (!name) return;
      previewToken += 1;
      const token = previewToken;
      let chosen = kbId || (where && where.kb_id) || "";
      let tabKey = chosen ? chosen + ":" + name : name;
      if (!openTabs.includes(tabKey)) openTabs.push(tabKey);
      activeTab = tabKey;
      paintTabs();
      if (!tabChunks[tabKey] && !chosen) {
        const known = await lookupBases(name);
        if (token === previewToken && known.length > 1) {
          preview.classList.remove("idle");
          const note = element("p", "muted", "Файл есть в нескольких базах");
          const list = document.createElement("ul");
          known.forEach((row) => {
            const item = document.createElement("li");
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = (row.kb_name || row.kb_id) + " / " + name;
            button.addEventListener("click", () => showPreview(name, where, row.kb_id));
            item.append(button);
            list.append(item);
          });
          preview.replaceChildren(note, list);
          return;
        }
        if (known.length === 1) {
          chosen = known[0].kb_id;
          tabKey = chosen + ":" + name;
          if (!openTabs.includes(tabKey)) openTabs.push(tabKey);
          if (token === previewToken) {
            activeTab = tabKey;
            paintTabs();
          }
        }
      }
      if (!tabChunks[tabKey]) {
        if (token === previewToken) {
          preview.classList.add("idle");
          preview.replaceChildren(element("p", "muted", "Открывается…"));
        }
        try {
          const url = chosen
            ? "/kb/" + encodeURIComponent(chosen) + "/documents/" + encodeURIComponent(name) + "/preview"
            : "/documents/" + encodeURIComponent(name) + "/preview";
          const response = await fetch(url, {
            signal: AbortSignal.timeout(15000),
          });
          const data = await response.json().catch(() => ({}));
          if (response.ok) tabChunks[tabKey] = data.chunks || [];
          if (token !== previewToken) return;
          if (!chosen) {
            if (activeTab !== name) return;
          } else if (activeTab !== tabKey) {
            return;
          }
          if (!response.ok) {
            preview.replaceChildren(element("p", "muted", data.detail || "Документ не найден"));
            return;
          }
        } catch (error) {
          if (token !== previewToken) return;
          if (!chosen) {
            if (activeTab !== name) return;
          } else if (activeTab !== tabKey) {
            return;
          }
          preview.replaceChildren(element("p", "muted", "Сервер не ответил"));
          return;
        }
      }
      if (token !== previewToken) return;
      if (activeTab !== name && activeTab !== tabKey) return;
      const chunks = tabChunks[tabKey] || [];
      if (!chunks.length) {
        preview.replaceChildren(element("p", "muted", "Нет текста"));
        return;
      }
      paintChunks(chunks, where || {});
    }

    function rateRow(label, value, onPick) {
      const row = element("div", "rate");
      row.append(element("span", "rate-label", label));
      for (let n = 1; n <= 5; n += 1) {
        const btn = element("button", n === value ? "n on" : "n", String(n));
        btn.type = "button";
        btn.setAttribute("aria-label", label + " " + n);
        btn.addEventListener("click", () => onPick(n));
        row.append(btn);
      }
      return row;
    }

    async function saveRate(index, body) {
      if (!dialogId || index < 0) return;
      await fetch("/ui/dialogs/" + encodeURIComponent(dialogId) + "/turns/" + index + "/ratings", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const row = current();
      if (!row || !row.turns || !row.turns[index]) return;
      const ratings = row.turns[index].ratings || {};
      if (body.answer_complete !== undefined) ratings.answer_complete = body.answer_complete;
      if (body.answer_correct !== undefined) ratings.answer_correct = body.answer_correct;
      if (body.links) ratings.links = Object.assign({}, ratings.links, body.links);
      if (body.documents) ratings.documents = Object.assign({}, ratings.documents, body.documents);
      row.turns[index].ratings = ratings;
    }

    function sourceBlocks(sources, answer, ratings, turnIndex) {
      const wrap = element("div", "source-block");
      const seen = new Set();
      const linkScores = (ratings && ratings.links) || {};
      const docScores = (ratings && ratings.documents) || {};
      for (const source of sources) {
        const cite = element("button", "chip", "[" + source.number + "]");
        cite.type = "button";
        cite.setAttribute("data-document", source.document_name);
        if (source.kb_id) cite.setAttribute("data-kb", source.kb_id);
        if (source.chunk_index != null && source.chunk_index !== "") {
          cite.setAttribute("data-index", String(source.chunk_index));
        }
        if (source.section) cite.setAttribute("data-section", source.section);
        if (answer) cite.setAttribute("data-answer", answer);
        wrap.append(cite);
        wrap.append(rateRow("Правильность ссылки", linkScores[String(source.number)], (n) => {
          const payload = { links: {} };
          payload.links[String(source.number)] = n;
          saveRate(turnIndex, payload).then(() => paintLog());
        }));
        const fileKey = (source.kb_id || "") + "\n" + source.document_name;
        if (!seen.has(fileKey)) {
          seen.add(fileKey);
          const fileLabel = source.kb_name ? source.kb_name + " / " + source.document_name : source.document_name;
          const file = element("button", "chip", fileLabel);
          file.type = "button";
          file.setAttribute("data-document", source.document_name);
          if (source.kb_id) file.setAttribute("data-kb", source.kb_id);
          wrap.append(file);
          wrap.append(rateRow("Правильность документа", docScores[source.document_name], (n) => {
            const payload = { documents: {} };
            payload.documents[source.document_name] = n;
            saveRate(turnIndex, payload).then(() => paintLog());
          }));
        }
      }
      return wrap;
    }

    function paintTurn(turn, index) {
      const box = element("div", "turn");
      box.append(element("div", "question", turn.query || ""));
      const answerBox = element("div", "a");
      answerBox.append(element("span", "a-avatar", "✦"));
      const answerBody = element("div", "a-body");
      answerBody.append(element("div", "a-text", turn.answer || ""));
      answerBox.append(answerBody);
      box.append(answerBox);
      const ratings = turn.ratings || {};
      box.append(rateRow("Полнота ответа", ratings.answer_complete, (n) => {
        saveRate(index, { answer_complete: n }).then(() => paintLog());
      }));
      box.append(rateRow("Корректность ответа", ratings.answer_correct, (n) => {
        saveRate(index, { answer_correct: n }).then(() => paintLog());
      }));
      const sources = turn.sources || [];
      if (sources.length) box.append(sourceBlocks(sources, turn.answer, ratings, index));
      return box;
    }

    function paintLog() {
      const row = current();
      const turns = (row && row.turns) || [];
      if (!turns.length) {
        log.replaceChildren(element("p", "muted", "Задайте вопрос по документам"));
        return;
      }
      log.replaceChildren(...turns.map((turn, index) => paintTurn(turn, index)));
      log.scrollTop = log.scrollHeight;
    }

    function treeFiles(node) {
      const names = [];
      if (!node) return names;
      if (node.document_name) names.push(node.document_name);
      (node.children || []).forEach((child) => names.push(...treeFiles(child)));
      return names;
    }

    function ensureTreeFiles(names) {
      function slots(node, kbId) {
        const here = String(node && node.id || "").startsWith("kb-") ? String(node.id).slice(3) : (kbId || "");
        const keys = [];
        if (!node) return keys;
        if (node.document_name) keys.push(here + "\n" + node.document_name);
        (node.children || []).forEach((child) => keys.push(...slots(child, here)));
        return keys;
      }
      const have = new Set(treeFiles(tree));
      const placed = new Set(slots(tree, ""));
      tree.children = tree.children || [];
      const rows = names || [];
      const kbIds = new Set(rows.map((row) => row && row.kb_id).filter(Boolean));
      rows.forEach((item) => {
        const name = item && item.name ? item.name : item;
        const kbId = item && item.kb_id ? item.kb_id : "";
        if (!name) return;
        if (kbId) {
          fileBase[name] = fileBase[name] || [];
          if (!fileBase[name].some((row) => row.kb_id === kbId)) fileBase[name].push(item);
        }
        if (kbIds.size > 1 && kbId) {
          const slot = kbId + "\n" + name;
          if (placed.has(slot)) return;
          let folder = (tree.children || []).find((child) => child.id === "kb-" + kbId);
          if (!folder) {
            folder = { id: "kb-" + kbId, name: item.kb_name || kbId, children: [] };
            tree.children.push(folder);
          }
          folder.children = folder.children || [];
          folder.children.push({ document_name: name });
          placed.add(slot);
          return;
        }
        if (have.has(name)) return;
        tree.children.push({ document_name: name });
        have.add(name);
      });
    }

    async function setMode(mode) {
      const agentOn = mode === "agent";
      modeAgent.classList.toggle("on", agentOn);
      modeDocs.classList.toggle("on", !agentOn);
      modeAgent.setAttribute("aria-selected", String(agentOn));
      modeDocs.setAttribute("aria-selected", String(!agentOn));
      agentPane.classList.toggle("hidden", !agentOn);
      docsPane.classList.toggle("hidden", agentOn);
      docsTools.classList.toggle("hidden", agentOn);
      if (agentOn) return;
      paintTree();
      try {
        const data = await (await fetch("/documents", { signal: AbortSignal.timeout(8000) })).json();
        ensureTreeFiles(data.documents || []);
        paintTree();
      } catch (error) {
        paintTree();
      }
    }

    function nodeMatches(node) {
      if (!filter) return true;
      if (node.document_name) return node.document_name.toLowerCase().includes(filter);
      if ((node.name || "").toLowerCase().includes(filter)) return true;
      return (node.children || []).some(nodeMatches);
    }

    function findParent(list, pred, parent) {
      for (const child of list) {
        if (pred(child)) return { parent: parent, node: child, list: list };
        if (child.children) {
          const hit = findParent(child.children, pred, child);
          if (hit) return hit;
        }
      }
      return null;
    }

    function containsNode(node, target) {
      if (!node || node === target) return node === target;
      return (node.children || []).some((child) => containsNode(child, target));
    }

    function persistTree() {
      treePending = true;
      treeStamp += 1;
      if (treeWriting) return;
      treeWriting = true;
      const run = async () => {
        try {
          while (treePending) {
            treePending = false;
            const payload = JSON.stringify({ tree: tree });
            let data = {};
            let ok = false;
            try {
              const response = await fetch("/ui", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: payload,
              });
              ok = response.ok;
              data = await response.json().catch(() => ({}));
            } catch (error) {
              return;
            }
            if (!ok) {
              if (data.detail) steps.append(element("p", "", data.detail));
              continue;
            }
            if (treePending || treeDragging) continue;
            if (data.tree) tree = data.tree;
            paintTree();
          }
        } finally {
          treeWriting = false;
          if (treePending) persistTree();
        }
      };
      run();
    }

    function paintTree() {
      treeEl.replaceChildren();
      fillTree(treeEl, tree.children || [], tree);
      if (treeEl.children.length) return;
      const item = element("li");
      item.append(element("p", "muted", "Нет документов"));
      treeEl.append(item);
    }

    function svgIcon(paths) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "1.8");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      svg.classList.add("fico");
      paths.forEach((d) => {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", d);
        svg.append(p);
      });
      return svg;
    }

    function icon(kind) {
      if (kind === "folder") {
        return svgIcon(["M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"]);
      }
      return svgIcon(["M7 3h7l5 5v13H7z", "M14 3v5h5"]);
    }

    function nameWithHighlight(name) {
      const text = String(name || "");
      const span = element("span", "fname");
      if (!filter) {
        span.textContent = text;
        return span;
      }
      const idx = text.toLowerCase().indexOf(filter);
      if (idx < 0) {
        span.textContent = text;
        return span;
      }
      span.append(document.createTextNode(text.slice(0, idx)));
      span.append(element("mark", "", text.slice(idx, idx + filter.length)));
      span.append(document.createTextNode(text.slice(idx + filter.length)));
      return span;
    }

    function fillTree(list, nodes, parent) {
      nodes.forEach((node) => {
        if (!nodeMatches(node)) return;
        const item = element("li");
        const btn = element("button", "node");
        btn.type = "button";
        btn.draggable = true;
        const isFile = Boolean(node.document_name);
        const closed = Boolean(node.id && closedFolders.has(node.id) && !filter);
        if (isFile) {
          btn.classList.add("file");
          btn.append(icon("file"));
          btn.append(nameWithHighlight(node.document_name));
        } else {
          btn.classList.add("folder");
          btn.append(element("span", "chev", closed ? "▸" : "▾"));
          btn.append(icon("folder"));
          btn.append(nameWithHighlight(node.name || "Папка"));
        }
        let openName = String(activeTab || "");
        const openMark = openName.indexOf(":");
        const openHead = openMark > 0 ? openName.slice(0, openMark) : "";
        if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(openHead)) {
          openName = openName.slice(openMark + 1);
        }
        if (isFile && node.document_name === openName) btn.classList.add("on");
        btn.addEventListener("click", () => {
          if (isFile) {
            const fromFolder = parent && String(parent.id || "").startsWith("kb-") ? String(parent.id).slice(3) : "";
            showPreview(node.document_name, null, fromFolder);
            paintTree();
            return;
          }
          if (closedFolders.has(node.id)) closedFolders.delete(node.id);
          else closedFolders.add(node.id);
          paintTree();
        });
        btn.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          openMenu(event, node, parent);
        });
        btn.addEventListener("dragstart", (event) => {
          treeDragging = true;
          event.dataTransfer.setData("text/plain", JSON.stringify({
            folder: !isFile,
            id: node.id || "",
            name: node.document_name || "",
          }));
        });
        btn.addEventListener("dragend", () => {
          treeDragging = false;
        });
        if (!isFile) {
          btn.addEventListener("dragover", (event) => {
            event.preventDefault();
            btn.classList.add("drop");
          });
          btn.addEventListener("dragleave", () => btn.classList.remove("drop"));
          btn.addEventListener("drop", (event) => {
            event.preventDefault();
            event.stopPropagation();
            btn.classList.remove("drop");
            dropOn(node, event.dataTransfer.getData("text/plain"));
          });
        }
        item.append(btn);
        if (!isFile && !closed && node.children) {
          const nested = element("ul");
          fillTree(nested, node.children, node);
          item.append(nested);
        }
        list.append(item);
      });
    }

    function dropOn(folder, raw) {
      let payload = {};
      try { payload = JSON.parse(raw); } catch (error) { return; }
      const pred = payload.folder
        ? (node) => node.id === payload.id
        : (node) => node.document_name === payload.name;
      const found = findParent(tree.children || [], pred, tree);
      if (!found) return;
      // Dropping a folder onto itself or onto something already inside it cycles
      // the tree. The next paint walks that cycle and the tab never recovers.
      // An ancestor, including the root, is a real target and must stay allowed.
      if (payload.folder && containsNode(found.node, folder)) return;
      const index = found.list.indexOf(found.node);
      if (index < 0) return;
      found.list.splice(index, 1);
      folder.children = folder.children || [];
      folder.children.push(found.node);
      if (folder.id) closedFolders.delete(folder.id);
      persistTree();
    }

    function openMenu(event, node, parent) {
      menuTarget = { node: node, parent: parent };
      menu.replaceChildren();
      const isFile = Boolean(node.document_name);
      if (!isFile) {

        if (node !== tree) {
          addMenu("Переименовать", () => renameFolder(node));
          addMenu("Удалить", () => removeFolder(node, parent));

      } else {
        addMenu("Удалить", () => removeFile(node.document_name, parent));
      }
      menu.classList.remove("hidden");
      const box = docsPane.getBoundingClientRect();
      menu.style.left = Math.max(0, Math.min(event.clientX - box.left, box.width - 180)) + "px";
      menu.style.top = Math.max(0, Math.min(event.clientY - box.top, box.height - 90)) + "px";
    }

    function addFolder(folder) {
      folder.children = folder.children || [];
      folder.children.unshift({ id: crypto.randomUUID(), name: "Папка", children: [] });

    function renameFolder(folder) {
      const name = window.prompt("Имя папки", folder.name || "Папка");
      if (!name || !name.trim()) return;

    function removeFolder(folder, parent) {
      if (!parent || !parent.children) return;
      const index = parent.children.indexOf(folder);
      if (index < 0) return;
      const kids = folder.children || [];
      parent.children.splice(index, 1, ...kids);
      persistTree();
    }

    async function removeFile(name, parent) {
      let kbId = parent && String(parent.id || "").startsWith("kb-") ? String(parent.id).slice(3) : "";
      const known = (typeof fileBase === "object" && fileBase) ? (fileBase[name] || []) : [];
      if (!kbId && known.length === 1) kbId = known[0].kb_id;
      const url = kbId
        ? "/kb/" + encodeURIComponent(kbId) + "/documents/" + encodeURIComponent(name)
        : "/documents/" + encodeURIComponent(name);
      await fetch(url, { method: "DELETE" });
      openTabs.filter((key) => {
        const text = String(key || "");
        const mark = text.indexOf(":");
        const head = mark > 0 ? text.slice(0, mark) : "";
        if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(head)) {
          return text.slice(mark + 1) === name;
        }
        return text === name;
      }).slice().forEach((key) => closeTab(key));
      await loadUi(false);
    }

    async function loadUi(selectStored) {
      // Сбой запроса не создаёт диалог и не затирает уже показанный список. Повтор через 2 с.
      // Дерево с сервера не подменяет локальное, пока запись папки ещё не закончилась.
      try {
        const stamp = treeStamp;
        const response = await fetch("/ui", { signal: AbortSignal.timeout(8000) });
        if (response.status === 401) {
          showGate();
          return;
        }
        if (!response.ok) throw new Error("ui");
        const data = await response.json();
        dialogs = data.dialogs || [];
        if (stamp === treeStamp && !treePending && !treeWriting && !treeDragging) {
          tree = data.tree || { id: "root", name: "", children: [] };
        }
        if (!dialogs.length) {
          const created = await (await fetch("/ui/dialogs", { method: "POST" })).json();
          if (created && created.id) dialogs = [created];
        }
        if (!dialogs.length) throw new Error("ui");
        if (selectStored) {
          const stored = sessionStorage.getItem("dialogId");
          dialogId = dialogs.some((row) => row.id === stored) ? stored : dialogs[0].id;
        } else if (!dialogs.some((row) => row.id === dialogId)) {
          dialogId = dialogs[0].id;
        }
        sessionStorage.setItem("dialogId", dialogId);
        paintChats();
        paintTree();
        uiLoaded = true;
        await selectDialog(dialogId, true);
      } catch (error) {
        if (!uiLoaded) log.replaceChildren(element("p", "muted", "Сервер не ответил"));
        setTimeout(() => loadUi(selectStored), 2000);
      }
    }

      if (row && row.id) {
        const index = dialogs.findIndex((item) => item.id === row.id);
        if (index >= 0) dialogs[index] = row;
        else dialogs.unshift(row);
      }
      paintChats();
      paintLog();
      if (!silent) setMode("agent");

    async function chooseBase() {

      if (targets.bases.length === 1 && !targets.create) return { kb_id: targets.bases[0].id };

      const body = new FormData();
      if (target.kb_id) body.append("kb_id", target.kb_id);
      if (target.new_name) body.append("new_name", target.new_name);
      for (const file of chosen) body.append("files", file);
      const request = new XMLHttpRequest();
      request.open("POST", "/upload");
      request.upload.onprogress = (event) => {
        if (!event.lengthComputable) return;
        for (const file of chosen) paintStep(file.name, Math.min(1, event.loaded / event.total), "загружен");

      request.onload = async () => {
        let data = {};
        try { data = JSON.parse(request.responseText); } catch (error) { data = {}; }

    async function showAudit() {
      adminBody.replaceChildren();
      const person = adminInput("id человека");
      const role = adminInput("id роли");
      const group = adminInput("id группы");
      const kind = adminInput("тип");
      const after = adminInput("с времени UTC");
      const before = adminInput("до времени UTC");
      const list = document.createElement("div");
      async function load(cursor) {
        list.replaceChildren();
        const query = new URLSearchParams();
        if (person.value) query.set("user", person.value);
        if (role.value) query.set("role", role.value);
        if (group.value) query.set("group", group.value);
        if (kind.value) query.set("kind", kind.value);
        if (after.value) query.set("after", after.value);
        if (before.value) query.set("before", before.value);
        if (cursor) query.set("before_id", String(cursor));
        const data = await (await fetch("/admin/audit?" + query.toString())).json();
        const events = data.events || [];
        events.forEach((event) => {
          list.append(adminButton(event.time + " " + event.kind + " " + event.login, async () => {
            const full = await (await fetch("/admin/audit/" + event.id)).json();
            field(list, "pre", JSON.stringify(full, null, 2));
          }));
        });
        if (events.length === 50) {
          const last = events[events.length - 1];
          list.append(adminButton("Дальше", () => {
            before.value = last.time || "";
            load(last.id);
          }));
        }
      }
      adminBody.append(person, role, group, kind, after, before, adminButton("Обновить", () => load()), list);
      await load();
    }

    document.getElementById("admin-users").addEventListener("click", showUsers);
    document.getElementById("admin-audit").addEventListener("click", showAudit);
    document.getElementById("admin-roles").addEventListener("click", async () => {
      adminBody.replaceChildren();
      field(adminBody, "p", "Действие роли само базу не открывает. Создание базы и «Открыть себе» эту матрицу не меняют.");
      const data = await (await fetch("/admin/roles")).json();
      const globals = ["manage_users", "manage_roles", "manage_groups", "manage_access", "create_kb", "view_audit"];
      const content = ["ask", "upload", "delete", "arrange"];
      const contentLabel = { ask: "Спрашивать", upload: "Загружать", delete: "Удалять", arrange: "Раскладывать" };
      (data.roles || []).forEach((role) => {
        const block = document.createElement("div");
        field(block, "p", role.name);
        const boxes = {};
        globals.forEach((action) => {
          const item = checkboxLine(action, (role.actions || []).includes(action));
          boxes[action] = item.box;
          block.append(item.line);
        });
        const matrix = {};
        (data.bases || []).forEach((base) => {
          field(block, "p", base.name);
          matrix[base.id] = {};
          content.forEach((action) => {
            const on = ((role.kb_actions || {})[base.id] || []).includes(action);
            const item = checkboxLine(contentLabel[action], on);
            matrix[base.id][action] = item.box;
            block.append(item.line);
          });
        });
        block.append(adminButton("Записать", async () => {
          const actions = globals.filter((action) => boxes[action].checked);
          const kbActions = {};
          Object.keys(matrix).forEach((kbId) => {
            kbActions[kbId] = content.filter((action) => matrix[kbId][action].checked);
          });
          const sent = await sendJson("/admin/roles/" + role.id, "PATCH", { actions: actions, kb_actions: kbActions });
          field(adminBody, "p", sent.ok ? "Записано" : (sent.payload.detail || "Ошибка"));
        }));
        block.append(adminButton("Удалить роль", async () => {
          const sent = await sendJson("/admin/roles/" + role.id, "DELETE");
          if (sent.ok) document.getElementById("admin-roles").click();
          else field(adminBody, "p", sent.payload.detail || "Ошибка");
        }));
        adminBody.append(block);
      });
      const name = adminInput("Имя роли");
      adminBody.append(name, adminButton("Создать роль", async () => {
        const sent = await sendJson("/admin/roles", "POST", { name: name.value });
        if (sent.ok) document.getElementById("admin-roles").click();
        else field(adminBody, "p", sent.payload.detail || "Ошибка");
      }));
    });
    document.getElementById("admin-groups").addEventListener("click", async () => {
      adminBody.replaceChildren();
      field(adminBody, "p", "Роль в группе — это все, у кого она есть сейчас и будет потом.");
      const data = await (await fetch("/admin/groups")).json();
      (data.groups || []).forEach((group) => {
        const block = document.createElement("div");
        field(block, "p", group.name);
        const users = adminInput("id людей через пробел");
        users.value = (group.user_ids || []).join(" ");
        const roles = adminInput("id ролей через пробел");
        roles.value = (group.role_ids || []).join(" ");
        block.append(users, roles, adminButton("Записать состав", async () => {
          const sent = await sendJson("/admin/groups/" + group.id + "/members", "PUT", {
            user_ids: users.value.split(/\s+/).filter(Boolean),
            role_ids: roles.value.split(/\s+/).filter(Boolean),
          });
          field(adminBody, "p", sent.ok ? "Состав записан" : (sent.payload.detail || "Ошибка"));
        }), adminButton("Удалить группу", async () => {
          const sent = await sendJson("/admin/groups/" + group.id, "DELETE");
          if (sent.ok) document.getElementById("admin-groups").click();
          else field(adminBody, "p", sent.payload.detail || "Ошибка");
        }));
        adminBody.append(block);
      });
      const name = adminInput("Имя группы");
      adminBody.append(name, adminButton("Создать группу", async () => {
        const sent = await sendJson("/admin/groups", "POST", { name: name.value });
        if (sent.ok) document.getElementById("admin-groups").click();
        else field(adminBody, "p", sent.payload.detail || "Ошибка");
      }));
    });
    document.getElementById("admin-access").addEventListener("click", async () => {
      adminBody.replaceChildren();
      field(adminBody, "p", "«Открыть» человека показывает ему эту базу. Загружать, удалять и раскладывать — отдельные галочки. Роль сама базу не открывает.");
      const data = await (await fetch("/admin/kb")).json();
      const people = data.people || [];
      const roles = data.roles || [];
      const groups = data.groups || [];
      const contentLabel = { ask: "Спрашивать", upload: "Загружать", delete: "Удалять", arrange: "Раскладывать" };
      const stateOf = (acl, type, id) => {
        const rows = (acl || []).filter((row) => row.subject_type === type && row.subject_id === id);
        if (rows.some((row) => row.effect === "deny")) return "закрыт";
        if (rows.some((row) => row.effect === "allow")) return "открыт";
        return "нет входа";
      };
      const filter = adminInput("База или человек");
      adminBody.append(filter);
      const mark = (label, title, state, boxes, openedUser) => {
        label.textContent = title + " — " + state;
        if (openedUser && boxes && boxes.ask) boxes.ask.checked = true;
        loadUi(false);
      };
      const openSubject = (baseId, type, id, label, title, boxes) => async () => {
        await sendJson("/admin/kb/" + baseId + "/deny", "DELETE", { subject_type: type, subject_id: id });
        const sent = await sendJson("/admin/kb/" + baseId + "/allow", "POST", { subject_type: type, subject_id: id });
        if (sent.ok) mark(label, title, "открыт", boxes, type === "user");
        else field(adminBody, "p", sent.payload.detail || "Ошибка");
      };
      const closeSubject = (baseId, type, id, label, title) => async () => {
        const sent = await sendJson("/admin/kb/" + baseId + "/deny", "POST", { subject_type: type, subject_id: id });
        if (sent.ok) mark(label, title, "закрыт");
        else field(adminBody, "p", sent.payload.detail || "Ошибка");
      };
      (data.bases || []).forEach((base) => {
        const block = document.createElement("details");
        block.className = "access-block";
        block.setAttribute("data-search", (base.name || "").toLowerCase());
        const head = document.createElement("summary");
        head.textContent = base.name;
        block.append(head);
        const tools = document.createElement("div");
        tools.className = "access-tools";
        tools.append(adminButton("Открыть себе", async () => {
          const sent = await sendJson("/admin/kb/" + base.id + "/self", "POST");
          if (!sent.ok) {
            field(block, "p", sent.payload.detail || "Ошибка");
            return;
          }
          const mine = me && block.querySelector('[data-subject="user:' + me.id + '"]');
          if (mine) {
            const label = mine.querySelector(".access-state");
            if (label) label.textContent = (me.login || "") + " — открыт";
            mine.querySelectorAll("input[type=checkbox]").forEach((box) => { box.checked = true; });
          }
          loadUi(false);
        }));
        block.append(tools);
        if (base.acl) {
          const addLine = (kind, id, title, boxes) => {
            const line = document.createElement("div");
            line.className = "access-row";
            line.setAttribute("data-subject", kind + ":" + id);
            const label = field(line, "p", title + " — " + stateOf(base.acl, kind, id), "access-state");
            line.append(adminButton("Открыть", openSubject(base.id, kind, id, label, title, boxes)));
            line.append(adminButton("Закрыть", closeSubject(base.id, kind, id, label, title)));
            return line;
          };
          roles.forEach((role) => block.append(addLine("role", role.id, "Роль " + role.name)));
          groups.forEach((group) => block.append(addLine("group", group.id, "Группа " + group.name)));
          people.forEach((person) => {
            const boxes = {};
            const line = addLine("user", person.id, person.login, boxes);
            if (base.personal) {
              ["ask", "upload", "delete", "arrange"].forEach((action) => {
                const item = checkboxLine(contentLabel[action], (base.personal[person.id] || []).includes(action));
                boxes[action] = item.box;
                line.append(item.line);
              });
              line.append(adminButton("Записать личные", async () => {
                const actions = ["ask", "upload", "delete", "arrange"].filter((action) => boxes[action].checked);
                const sent = await sendJson("/admin/kb/" + base.id + "/people/" + person.id + "/actions", "PUT", { actions: actions });
                if (!sent.ok) field(block, "p", sent.payload.detail || "Ошибка");
                else loadUi(false);
              }));
            }
            block.append(line);
          });
        }
        adminBody.append(block);
      });
      const applyFilter = () => {
        const query = filter.value.trim().toLowerCase();
        adminBody.querySelectorAll("details.access-block").forEach((block) => {
          const baseHit = !query || (block.getAttribute("data-search") || "").includes(query);
          let rowHit = false;
          block.querySelectorAll(".access-row").forEach((row) => {
            const text = ((row.querySelector(".access-state") || {}).textContent || "").toLowerCase();
            const hit = !query || baseHit || text.includes(query);
            row.classList.toggle("hidden", Boolean(query) && !hit);
            if (hit) rowHit = true;
          });
          const show = !query || baseHit || rowHit;
          block.classList.toggle("hidden", !show);
          if (query && show) block.open = true;
        });
      };
      filter.addEventListener("input", applyFilter);
    });

    async function boot() {
      const response = await fetch("/me");
      if (!response.ok) {
        showGate();
        return;
      }
      paintMe(await response.json());
      idlePreview();
      showReady();
      loadUi(true);
    }
    boot();
  </script>
</body>
</html>
