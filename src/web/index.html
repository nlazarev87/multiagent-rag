<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Документы</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; }
    #shell { flex: 1; min-height: 0; height: auto; }
    body {
      --left: 260px;
      --mid: 380px;
      --chrome: #F3F3F3;
      --editor: #FCFCFC;
      --fg: #141414;
      --fg2: #141414BD;
      --fg3: #14141499;
      --fg4: #1414145C;
      --line: #14141414;
      --line2: #1414141F;
      --line3: #14141433;
      --wash: #14141414;
      --focus: #14141424;
      --link: #0064B0;
      --btn: #2778C1;
      --btn-hover: #246AAB;
      --ready: #007041;
      --hit: #3B7E8424;
      --danger: #BE1744;
      background: var(--chrome);
      color: var(--fg);
      font-family: "Segoe UI", "Segoe WPC", system-ui, sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;
    }
    .shell {
      display: grid;
      grid-template-columns: var(--left) 1px var(--mid) 1px minmax(0, 1fr);
      height: 100%;
      min-height: 0;
    }
    .pane {
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--chrome);
    }
    .editor { background: var(--editor); }
    .sash {
      position: relative;
      background: var(--line);
      cursor: col-resize;
      z-index: 2;
    }
    .sash:hover, .sash.drag { background: var(--line2); }
    .sash::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -2px;
      width: 4px;
    }
    button {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 0;
      border-radius: 8px;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .hidden { display: none !important; }
    .side-head { padding: 6px 8px 4px; }
    #fresh {
      display: flex;
      align-items: center;
      width: 100%;
      height: 28px;
      padding: 0 8px;
      font-weight: 500;
    }
    #fresh:hover { background: var(--wash); }
    #chats {
      list-style: none;
      margin: 4px 6px 0;
      padding: 0;
      flex: 1;
      overflow: auto;
    }
    #chats li {
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 28px;
      padding: 0 8px;
      border-radius: 8px;
      color: var(--fg2);
    }
    #chats li:hover { background: var(--wash); color: var(--fg); }
    #chats li.on { background: var(--wash); color: var(--fg); font-weight: 500; }
    #chats .title {
      flex: 1;
      text-align: left;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding: 0;
      border-radius: 0;
    }
    #chats .kill {
      width: 22px;
      height: 22px;
      color: var(--fg3);
      opacity: 0;
      display: grid;
      place-items: center;
      font-size: 14px;
      line-height: 1;
    }
    #chats li:hover .kill, #chats .kill:focus { opacity: 1; }
    #chats .kill:hover { color: var(--danger); background: var(--focus); }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 10px;
      color: var(--fg2);
      font-size: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #C5C5C5;
      flex-shrink: 0;
    }
    .dot.on { background: var(--ready); }
    #readiness { margin: 0; }
    .mid-head {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 4px 10px;
    }
    .seg { display: flex; gap: 12px; }
    .seg button { height: 22px; color: var(--fg2); font-size: 12px; border-radius: 0; }
    .seg button.on { color: var(--fg); font-weight: 500; }
    .docs-tools { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    #find-toggle, #upload {
      width: 26px;
      height: 26px;
      color: var(--fg2);
      display: grid;
      place-items: center;
    }
    #find-toggle:hover, #upload:hover { background: var(--wash); color: var(--fg); }
    #find {
      width: 9.5rem;
      height: 26px;
      padding: 0 8px;
      border: 1px solid var(--line3);
      border-radius: 8px;
      background: var(--editor);
      color: var(--fg);
      font: inherit;
    }
    #find::placeholder { color: var(--fg4); }
    #files { display: none; }
    .mid-body {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #agent-pane, #docs-pane {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    #log { flex: 1; overflow: auto; }
    .turn {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 14px;
    }
    .question {
      align-self: flex-end;
      max-width: 90%;
      background: var(--wash);
      border-radius: 12px;
      padding: 6px 10px;
    }
    .answer { white-space: pre-wrap; line-height: 1.5; }
    .rate {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--fg3);
    }
    .rate-label { min-width: 11.5rem; }
    .n {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      color: var(--fg3);
    }
    .n.on { background: var(--focus); color: var(--fg); font-weight: 500; }
    .n:hover { background: var(--wash); color: var(--fg); }
    .source-block { display: flex; flex-direction: column; gap: 4px; }
    .chip {
      align-self: flex-start;
      height: 22px;
      padding: 0 8px;
      border-radius: 6px;
      background: var(--wash);
      color: var(--link);
      font-size: 12px;
    }
    .chip:hover { background: var(--focus); }
    #ask {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin: 8px 12px 12px;
      padding: 8px 8px 8px 12px;
      border: 1px solid var(--line3);
      border-radius: 12px;
      background: var(--editor);
    }
    #query {
      flex: 1;
      min-height: 36px;
      max-height: 88px;
      border: 0;
      resize: none;
      outline: none;
      font: inherit;
      background: transparent;
      color: var(--fg);
    }
    #query::placeholder { color: var(--fg4); }
    #send {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: var(--btn);
      color: var(--editor);
    }
    #send:hover { background: var(--btn-hover); }
    #tree { list-style: none; margin: 4px 0 0; padding: 0 8px; flex: 1; min-height: 0; overflow: auto; }
    #tree-tail { flex: 0 0 28px; min-height: 28px; }
    #tree ul { list-style: none; margin: 0; padding: 0 0 0 14px; }
    .node {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-height: 24px;
      padding: 0 6px;
      border-radius: 8px;
      color: var(--fg2);
      text-align: left;
    }
    .node:hover, .node.on { background: var(--wash); color: var(--fg); }
    .node.drop { background: var(--focus); }
    .node input {
      flex: 1;
      min-width: 0;
      height: 22px;
      border: 1px solid var(--line3);
      border-radius: 4px;
      font: inherit;
      padding: 0 6px;
    }
    .menu {
      position: absolute;
      min-width: 10.5rem;
      padding: 4px;
      background: var(--editor);
      border: 1px solid var(--line2);
      border-radius: 8px;
      box-shadow: 0 8px 24px #14141424;
      z-index: 5;
    }
    .menu button {
      display: block;
      width: 100%;
      text-align: left;
      height: 26px;
      padding: 0 8px;
    }
    .menu button:hover { background: var(--wash); }
    #steps { padding: 0 10px 8px; font-size: 12px; color: var(--fg3); }
    .tabs {
      display: flex;
      align-items: stretch;
      min-height: 35px;
      background: var(--chrome);
      overflow-x: auto;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 16rem;
      padding: 0 10px 0 12px;
      color: var(--fg2);
      background: var(--chrome);
      flex-shrink: 0;
      border-radius: 0;
      cursor: pointer;
    }
    .tab.on { background: var(--editor); color: var(--fg); }
    .tab span {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .tab .x {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      color: var(--fg3);
    }
    .tab .x:hover { background: var(--focus); color: var(--fg); }
    .canvas { flex: 1; overflow: auto; padding: 18px 28px 32px; background: var(--editor); }
    .paper.idle { color: var(--fg3); }
    .muted { margin: 24px 0 0; color: var(--fg3); font-size: 12px; }
    .chunk { margin: 0; }
    .chunk p {
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1.55;
    }
    .chunk p.hit { background: var(--hit); padding: 2px 4px; }
    .file { margin: 4px 0; }
    #gate, #admin, #pick {
      position: fixed;
      inset: 0;
      background: var(--chrome);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    #admin { align-items: stretch; justify-content: stretch; }
    .card {
      width: min(420px, calc(100% - 32px));
      background: var(--editor);
      border: 1px solid var(--line2);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card input, .admin-body input, .admin-body select {
      font: inherit;
      color: inherit;
      background: var(--chrome);
      border: 1px solid var(--line2);
      border-radius: 6px;
      padding: 6px 8px;
    }
    .card button, .text-btn {
      font: inherit;
      background: var(--btn);
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }
    #status {
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      background: var(--chrome);
      border-top: 1px solid var(--line);
      color: var(--fg2);
      font-size: 12px;
    }
    .admin-body { flex: 1; overflow: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .admin-head { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
  <form id="gate" class="hidden">
    <div class="card">
      <p id="gate-title">Вход</p>
      <input id="gate-login" autocomplete="username" placeholder="Логин" aria-label="Логин">
      <input id="gate-password" type="password" autocomplete="current-password" placeholder="Пароль" aria-label="Пароль">
      <button id="gate-submit" class="text-btn" type="submit">Войти</button>
      <p id="gate-error"></p>
    </div>
  </form>
  <section id="admin" class="hidden" aria-label="Управление">
    <div class="admin-head">
      <button type="button" id="admin-users" class="text-btn">Люди</button>
      <button type="button" id="admin-roles" class="text-btn">Роли</button>
      <button type="button" id="admin-groups" class="text-btn">Группы</button>
      <button type="button" id="admin-access" class="text-btn">Доступы</button>
      <button type="button" id="admin-audit" class="text-btn">Журнал</button>
      <button type="button" id="admin-close" class="text-btn">Закрыть</button>
    </div>
    <div id="admin-body" class="admin-body"></div>
  </section>
  <main class="shell" id="shell">
    <aside class="pane" aria-label="Диалоги">
      <div class="side-head">
        <button id="fresh" type="button">Новый диалог</button>
        <button id="manage" type="button" class="hidden">Управление</button>
      </div>
      <ul id="chats"></ul>
      <div class="status">
        <span class="dot" id="ready-dot"></span>
        <p id="readiness">Модель загружается…</p>
      </div>
    </aside>
    <div class="sash" id="sash-left" role="separator" aria-orientation="vertical" aria-label="Граница диалогов"></div>
    <section class="pane" aria-label="Агент">
      <div class="mid-head">
        <div class="seg" role="tablist" aria-label="Режим">
          <button type="button" id="mode-agent" class="on" role="tab" aria-selected="true">Agent</button>
          <button type="button" id="mode-docs" role="tab" aria-selected="false">Документы</button>
        </div>
        <div class="docs-tools hidden" id="docs-tools">
          <input id="find" class="hidden" type="search" placeholder="Поиск документа" aria-label="Поиск документа">
          <button id="find-toggle" type="button" aria-label="Поиск" aria-expanded="false">⌕</button>
          <button id="upload" type="button" aria-label="Загрузить">↑</button>
          <input id="files" type="file" multiple accept=".txt,.md,.doc,.docx">
        </div>
      </div>
      <div class="mid-body">
        <div id="agent-pane">
          <div id="log"></div>
          <form id="ask">
            <textarea id="query" required placeholder="Спросить по документам"></textarea>
            <button id="send" type="submit" aria-label="Спросить">→</button>
          </form>
        </div>
        <div id="docs-pane" class="hidden">
          <ul id="tree"></ul>
          <div id="tree-tail"></div>
          <div id="steps"></div>
          <div id="menu" class="menu hidden" role="menu"></div>
        </div>
      </div>
    </section>
    <div class="sash" id="sash-right" role="separator" aria-orientation="vertical" aria-label="Граница документа"></div>
    <section class="pane editor" aria-label="Документ">
      <div class="tabs" id="tabs"></div>
      <div class="canvas">
        <div id="preview" class="paper idle"></div>
      </div>
    </section>
  </main>
  <footer id="status"><span id="status-login"></span><span id="status-role"></span><button type="button" id="status-password">Сменить пароль</button><button type="button" id="status-out">Выйти</button></footer>
  <script>
    const shell = document.getElementById("shell");
    const chatsEl = document.getElementById("chats");
    const log = document.getElementById("log");
    const tabsEl = document.getElementById("tabs");
    const preview = document.getElementById("preview");
    const treeEl = document.getElementById("tree");
    const menu = document.getElementById("menu");
    const find = document.getElementById("find");
    const files = document.getElementById("files");
    const steps = document.getElementById("steps");
    const query = document.getElementById("query");
    const ask = document.getElementById("ask");
    const send = document.getElementById("send");
    const readiness = document.getElementById("readiness");
    const readyDot = document.getElementById("ready-dot");
    const agentPane = document.getElementById("agent-pane");
    const docsPane = document.getElementById("docs-pane");
    const docsTools = document.getElementById("docs-tools");
    const modeAgent = document.getElementById("mode-agent");
    const modeDocs = document.getElementById("mode-docs");

    let systemReady = false;
    let uiLoaded = false;
    let treeFresh = false;
    let dialogs = [];
    let dialogId = "";
    let tree = { id: "root", name: "", children: [] };
    let filter = "";
    let openTabs = [];
    let activeTab = "";
    let tabChunks = {};
    let menuTarget = null;
    let closedFolders = new Set();
    let treeStamp = 0;
    let treePending = false;
    let treeWriting = false;
    let me = null;
    let fileBase = {};

    function field(parent, tag, text, className) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      parent.append(node);
      return node;
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function tokens(text) {
      return new Set(String(text || "").toLowerCase().replace(/ё/g, "е").match(/[0-9a-zа-я]+/g) || []);
    }

    function contentWords(text) {
      return new Set([...tokens(text)].filter((word) => word.length >= 5));
    }

    function coverage(answer, paragraph) {
      const have = contentWords(paragraph);
      let score = 0;
      for (const word of contentWords(answer)) if (have.has(word)) score += 1;
      return score;
    }

    function blocks(text) {
      return String(text || "").split(/\n+/).map((line) => line.trim()).filter(Boolean);
    }

    function bindSash(sash, prop, min, max) {
      sash.addEventListener("mousedown", (event) => {
        event.preventDefault();
        const startX = event.clientX;
        const start = parseInt(getComputedStyle(document.body).getPropertyValue(prop), 10);
        sash.classList.add("drag");
        function move(moveEvent) {
          const next = Math.min(max, Math.max(min, start + (moveEvent.clientX - startX)));
          document.body.style.setProperty(prop, next + "px");
        }
        function up() {
          sash.classList.remove("drag");
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", up);
        }
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      });
    }

    bindSash(document.getElementById("sash-left"), "--left", 200, 480);
    bindSash(document.getElementById("sash-right"), "--mid", 280, 640);

    function current() {
      return dialogs.find((row) => row.id === dialogId) || null;
    }

    function paintChats() {
      chatsEl.replaceChildren();
      dialogs.forEach((row) => {
        const item = element("li", row.id === dialogId ? "on" : "");
        const open = element("button", "title", row.title || "Новый диалог");
        open.type = "button";
        open.addEventListener("click", () => selectDialog(row.id));
        const kill = element("button", "kill", "×");
        kill.type = "button";
        kill.setAttribute("aria-label", "Удалить диалог");
        kill.addEventListener("click", (event) => {
          event.stopPropagation();
          removeDialog(row.id);
        });
        item.append(open, kill);
        chatsEl.append(item);
      });
    }

    function idlePreview() {
      preview.classList.add("idle");
      preview.replaceChildren(element("p", "muted", "Откройте документ из чата или из дерева."));
    }

    function paintTabs() {
      tabsEl.replaceChildren();
      openTabs.forEach((name) => {
        const tab = element("div", name === activeTab ? "tab on" : "tab");
        tab.append(element("span", "", name));
        tab.addEventListener("click", () => showPreview(name));
        const close = element("button", "x", "×");
        close.type = "button";
        close.setAttribute("aria-label", "Закрыть вкладку");
        close.addEventListener("click", (event) => {
          event.stopPropagation();
          closeTab(name);
        });
        tab.append(close);
        tabsEl.append(tab);
      });
    }

    function closeTab(name) {
      openTabs = openTabs.filter((item) => item !== name);
      delete tabChunks[name];
      if (activeTab === name) activeTab = openTabs[0] || "";
      paintTabs();
      if (!activeTab) {
        idlePreview();
        return;
      }
      paintChunks(tabChunks[activeTab] || [], {});
    }

    function paintChunks(chunks, where) {
      where = where || {};
      let target = -1;
      if (where.chunkIndex !== undefined && where.chunkIndex !== "") {
        const want = Number(where.chunkIndex);
        target = chunks.findIndex((chunk) => Number(chunk.chunk_index) === want);
      } else if (where.section) {
        target = chunks.findIndex((chunk) => chunk.section === where.section);
      }
      let best = { score: 0, chunk: -1, part: -1 };
      if (where.answer) {
        chunks.forEach((chunk, index) => {
          blocks(chunk.text).forEach((part, place) => {
            const score = coverage(where.answer, part);
            if (score < 1) return;
            const inTarget = index === target;
            const bestOutside = best.chunk !== target;
            if (score > best.score || (score === best.score && inTarget && bestOutside)) {
              best = { score, chunk: index, part: place };
            }
          });
        });
      }
      preview.classList.remove("idle");
      preview.replaceChildren(...chunks.map((chunk, index) => {
        const article = element("article", "chunk");
        article.setAttribute("data-index", String(chunk.chunk_index));
        if (chunk.section) article.title = chunk.section;
        for (const [place, part] of blocks(chunk.text).entries()) {
          const hit = best.score > 0 && index === best.chunk && place === best.part;
          article.append(element("p", hit ? "hit" : "", part));
        }
        return article;
      }));
      const marked = preview.querySelector(".hit");
      if (marked) {
        marked.scrollIntoView({ block: "center" });
        return;
      }
      if (target >= 0) {
        const article = preview.querySelector("[data-index=\"" + chunks[target].chunk_index + "\"]");
        if (article) {
          article.scrollIntoView({ block: "start" });
          return;
        }
      }
      preview.parentNode.scrollTop = 0;
    }

    async function showPreview(name, where, kbId) {
      if (!name) return;
      const known = (typeof fileBase === "object" && fileBase) ? (fileBase[name] || []) : [];
      const chosen = kbId || (where && where.kb_id) || (known.length === 1 ? known[0].kb_id : "");
      if (!chosen && known.length > 1) {
        preview.classList.remove("idle");
        const note = element("p", "muted", "Файл есть в нескольких базах");
        const list = document.createElement("ul");
        known.forEach((row) => {
          const item = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = row.kb_name + " / " + name;
          button.addEventListener("click", () => showPreview(name, where, row.kb_id));
          item.append(button);
          list.append(item);
        });
        preview.replaceChildren(note, list);
        return;
      }
      const tabKey = chosen ? chosen + ":" + name : name;
      if (!openTabs.includes(tabKey)) openTabs.push(tabKey);
      activeTab = tabKey;
      paintTabs();
      if (!tabChunks[name] && !tabChunks[tabKey]) {
        preview.classList.add("idle");
        preview.replaceChildren(element("p", "muted", "Открывается…"));
        try {
          const url = chosen
            ? "/kb/" + encodeURIComponent(chosen) + "/documents/" + encodeURIComponent(name) + "/preview"
            : "/documents/" + encodeURIComponent(name) + "/preview";
          const response = await fetch(url, {
            signal: AbortSignal.timeout(15000),
          });
          const data = await response.json().catch(() => ({}));
          if (response.ok) {
            tabChunks[name] = data.chunks || [];
            tabChunks[tabKey] = tabChunks[name];
          }
          if (!chosen) {
            if (activeTab !== name) return;
          } else if (activeTab !== tabKey) {
            return;
          }
          if (!response.ok) {
            preview.replaceChildren(element("p", "muted", data.detail || "Документ не найден"));
            return;
          }
        } catch (error) {
          if (!chosen) {
            if (activeTab !== name) return;
          } else if (activeTab !== tabKey) {
            return;
          }
          preview.replaceChildren(element("p", "muted", "Сервер не ответил"));
          return;
        }
      }
      if (activeTab !== name && activeTab !== tabKey) return;
      const chunks = tabChunks[name] || tabChunks[tabKey] || [];
      if (!chunks.length) {
        preview.replaceChildren(element("p", "muted", "Нет текста"));
        return;
      }
      paintChunks(chunks, where || {});
    }

    function rateRow(label, value, onPick) {
      const row = element("div", "rate");
      row.append(element("span", "rate-label", label));
      for (let n = 1; n <= 5; n += 1) {
        const btn = element("button", n === value ? "n on" : "n", String(n));
        btn.type = "button";
        btn.setAttribute("aria-label", label + " " + n);
        btn.addEventListener("click", () => onPick(n));
        row.append(btn);
      }
      return row;
    }

    async function saveRate(index, body) {
      if (!dialogId || index < 0) return;
      await fetch("/ui/dialogs/" + encodeURIComponent(dialogId) + "/turns/" + index + "/ratings", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const row = current();
      if (!row || !row.turns || !row.turns[index]) return;
      const ratings = row.turns[index].ratings || {};
      if (body.answer_complete !== undefined) ratings.answer_complete = body.answer_complete;
      if (body.answer_correct !== undefined) ratings.answer_correct = body.answer_correct;
      if (body.links) ratings.links = Object.assign({}, ratings.links, body.links);
      if (body.documents) ratings.documents = Object.assign({}, ratings.documents, body.documents);
      row.turns[index].ratings = ratings;
    }

    function sourceBlocks(sources, answer, ratings, turnIndex) {
      const wrap = element("div", "source-block");
      const seen = new Set();
      const linkScores = (ratings && ratings.links) || {};
      const docScores = (ratings && ratings.documents) || {};
      for (const source of sources) {
        const cite = element("button", "chip", "[" + source.number + "]");
        cite.type = "button";
        cite.setAttribute("data-document", source.document_name);
        if (source.chunk_index != null && source.chunk_index !== "") {
          cite.setAttribute("data-index", String(source.chunk_index));
        }
        if (source.section) cite.setAttribute("data-section", source.section);
        if (answer) cite.setAttribute("data-answer", answer);
        wrap.append(cite);
        wrap.append(rateRow("Правильность ссылки", linkScores[String(source.number)], (n) => {
          const payload = { links: {} };
          payload.links[String(source.number)] = n;
          saveRate(turnIndex, payload).then(() => paintLog());
        }));
        if (!seen.has(source.document_name)) {
          seen.add(source.document_name);
          const file = element("button", "chip", source.document_name);
          file.type = "button";
          file.setAttribute("data-document", source.document_name);
          wrap.append(file);
          wrap.append(rateRow("Правильность документа", docScores[source.document_name], (n) => {
            const payload = { documents: {} };
            payload.documents[source.document_name] = n;
            saveRate(turnIndex, payload).then(() => paintLog());
          }));
        }
      }
      return wrap;
    }

    function paintTurn(turn, index) {
      const box = element("div", "turn");
      box.append(element("div", "question", turn.query || ""));
      box.append(element("div", "answer", turn.answer || ""));
      const ratings = turn.ratings || {};
      box.append(rateRow("Полнота ответа", ratings.answer_complete, (n) => {
        saveRate(index, { answer_complete: n }).then(() => paintLog());
      }));
      box.append(rateRow("Корректность ответа", ratings.answer_correct, (n) => {
        saveRate(index, { answer_correct: n }).then(() => paintLog());
      }));
      const sources = turn.sources || [];
      if (sources.length) box.append(sourceBlocks(sources, turn.answer, ratings, index));
      return box;
    }

    function paintLog() {
      const row = current();
      const turns = (row && row.turns) || [];
      if (!turns.length) {
        log.replaceChildren(element("p", "muted", "Задайте вопрос по документам"));
        return;
      }
      log.replaceChildren(...turns.map((turn, index) => paintTurn(turn, index)));
      log.scrollTop = log.scrollHeight;
    }

    function treeFiles(node) {
      const names = [];
      if (!node) return names;
      if (node.document_name) names.push(node.document_name);
      (node.children || []).forEach((child) => names.push(...treeFiles(child)));
      return names;
    }

    function ensureTreeFiles(names) {
      const have = new Set(treeFiles(tree));
      tree.children = tree.children || [];
      (names || []).forEach((item) => {
        const name = item && item.name ? item.name : item;
        const kbId = item && item.kb_id ? item.kb_id : "";
        if (name && kbId) {
          fileBase[name] = fileBase[name] || [];
          if (!fileBase[name].some((row) => row.kb_id === kbId)) fileBase[name].push(item);
        }
        if (name && !have.has(name)) {
          const kbIds = new Set((names || []).map((row) => row && row.kb_id).filter(Boolean));
          if (kbIds.size > 1 && kbId) {
            let folder = (tree.children || []).find((child) => child.id === "kb-" + kbId);
            if (!folder) {
              folder = { id: "kb-" + kbId, name: item.kb_name || kbId, children: [] };
              tree.children.push(folder);
            }
            folder.children.push({ document_name: name });
          } else {
            tree.children.push({ document_name: name });
          }
          have.add(name);
        }
      });
    }

    async function setMode(mode) {
      const agentOn = mode === "agent";
      modeAgent.classList.toggle("on", agentOn);
      modeDocs.classList.toggle("on", !agentOn);
      modeAgent.setAttribute("aria-selected", String(agentOn));
      modeDocs.setAttribute("aria-selected", String(!agentOn));
      agentPane.classList.toggle("hidden", !agentOn);
      docsPane.classList.toggle("hidden", agentOn);
      docsTools.classList.toggle("hidden", agentOn);
      if (agentOn) return;
      paintTree();
      if (treeFiles(tree).length) return;
      try {
        const data = await (await fetch("/documents", { signal: AbortSignal.timeout(8000) })).json();
        ensureTreeFiles(data.documents || []);
        paintTree();
      } catch (error) {
        paintTree();
      }
    }

    function nodeMatches(node) {
      if (!filter) return true;
      if (node.document_name) return node.document_name.toLowerCase().includes(filter);
      if ((node.name || "").toLowerCase().includes(filter)) return true;
      return (node.children || []).some(nodeMatches);
    }

    function findParent(list, pred, parent) {
      for (const child of list) {
        if (pred(child)) return { parent: parent, node: child, list: list };
        if (child.children) {
          const hit = findParent(child.children, pred, child);
          if (hit) return hit;
        }
      }
      return null;
    }

    function containsNode(node, target) {
      if (!node || node === target) return node === target;
      return (node.children || []).some((child) => containsNode(child, target));
    }

    function persistTree() {
      treePending = true;
      treeStamp += 1;
      if (treeWriting) return;
      treeWriting = true;
      const run = async () => {
        try {
          while (treePending) {
            treePending = false;
            const payload = JSON.stringify({ tree: tree });
            let data = {};
            let ok = false;
            try {
              const response = await fetch("/ui", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: payload,
              });
              ok = response.ok;
              data = await response.json().catch(() => ({}));
            } catch (error) {
              return;
            }
            if (!ok || treePending) continue;
            if (data.tree) tree = data.tree;
            paintTree();
          }
        } finally {
          treeWriting = false;
          if (treePending) persistTree();
        }
      };
      run();
    }

    function paintTree() {
      treeEl.replaceChildren();
      fillTree(treeEl, tree.children || [], tree);
      if (treeEl.children.length) return;
      const item = element("li");
      item.append(element("p", "muted", "Нет документов"));
      treeEl.append(item);
    }

    function fillTree(list, nodes, parent) {
      nodes.forEach((node) => {
        if (!nodeMatches(node)) return;
        const item = element("li");
        const btn = element("button", "node");
        btn.type = "button";
        btn.draggable = true;
        const isFile = Boolean(node.document_name);
        const closed = Boolean(node.id && closedFolders.has(node.id) && !filter);
        btn.append(element("span", "", isFile ? "" : (closed ? "▸" : "▾")));
        btn.append(element("span", "", isFile ? node.document_name : (node.name || "Папка")));
        if (isFile && node.document_name === activeTab) btn.classList.add("on");
        btn.addEventListener("click", () => {
          if (isFile) {
            showPreview(node.document_name);
            paintTree();
            return;
          }
          if (closedFolders.has(node.id)) closedFolders.delete(node.id);
          else closedFolders.add(node.id);
          paintTree();
        });
        btn.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          openMenu(event, node, parent);
        });
        btn.addEventListener("dragstart", (event) => {
          event.dataTransfer.setData("text/plain", JSON.stringify({
            folder: !isFile,
            id: node.id || "",
            name: node.document_name || "",
          }));
        });
        if (!isFile) {
          btn.addEventListener("dragover", (event) => {
            event.preventDefault();
            btn.classList.add("drop");
          });
          btn.addEventListener("dragleave", () => btn.classList.remove("drop"));
          btn.addEventListener("drop", (event) => {
            event.preventDefault();
            event.stopPropagation();
            btn.classList.remove("drop");
            dropOn(node, event.dataTransfer.getData("text/plain"));
          });
        }
        item.append(btn);
        if (!isFile && !closed && node.children) {
          const nested = element("ul");
          fillTree(nested, node.children, node);
          item.append(nested);
        }
        list.append(item);
      });
    }

    function dropOn(folder, raw) {
      let payload = {};
      try { payload = JSON.parse(raw); } catch (error) { return; }
      const pred = payload.folder
        ? (node) => node.id === payload.id
        : (node) => node.document_name === payload.name;
      const found = findParent(tree.children || [], pred, tree);
      if (!found) return;
      // Dropping a folder onto itself or onto something already inside it cycles
      // the tree. The next paint walks that cycle and the tab never recovers.
      // An ancestor, including the root, is a real target and must stay allowed.
      if (payload.folder && containsNode(found.node, folder)) return;
      const index = found.list.indexOf(found.node);
      if (index < 0) return;
      found.list.splice(index, 1);
      folder.children = folder.children || [];
      folder.children.push(found.node);
      if (folder.id) closedFolders.delete(folder.id);
      persistTree();
    }

    function openMenu(event, node, parent) {
      menuTarget = { node: node, parent: parent };
      menu.replaceChildren();
      const isFile = Boolean(node.document_name);
      if (!isFile) {
        addMenu("Новая папка", () => addFolder(node));
        if (node !== tree) {
          addMenu("Переименовать", () => renameFolder(node));
          addMenu("Удалить", () => removeFolder(node, parent));
        }
      } else {
        addMenu("Удалить", () => removeFile(node.document_name));
      }
      menu.classList.remove("hidden");
      const box = docsPane.getBoundingClientRect();
      menu.style.left = Math.max(0, Math.min(event.clientX - box.left, box.width - 180)) + "px";
      menu.style.top = Math.max(0, Math.min(event.clientY - box.top, box.height - 90)) + "px";
    }

    function addMenu(label, action) {
      const btn = element("button", "", label);
      btn.type = "button";
      btn.setAttribute("role", "menuitem");
      btn.addEventListener("click", () => {
        menu.classList.add("hidden");
        action();
      });
      menu.append(btn);
    }

    function addFolder(folder) {
      folder.children = folder.children || [];
      folder.children.unshift({ id: crypto.randomUUID(), name: "Папка", children: [] });
      if (folder.id) closedFolders.delete(folder.id);
      persistTree();
    }

    function renameFolder(folder) {
      const name = window.prompt("Имя папки", folder.name || "Папка");
      if (!name || !name.trim()) return;
      folder.name = name.trim().slice(0, 80);
      persistTree();
    }

    function removeFolder(folder, parent) {
      if (!parent || !parent.children) return;
      const index = parent.children.indexOf(folder);
      if (index < 0) return;
      const kids = folder.children || [];
      parent.children.splice(index, 1, ...kids);
      persistTree();
    }

    async function removeFile(name) {
      await fetch("/documents/" + encodeURIComponent(name), { method: "DELETE" });
      if (openTabs.includes(name)) closeTab(name);
      await loadUi(false);
    }

    async function loadUi(selectStored) {
      // Сбой запроса не создаёт диалог и не затирает уже показанный список. Повтор через 2 с.
      // Дерево с сервера не подменяет локальное, пока запись папки ещё не закончилась.
      try {
        const stamp = treeStamp;
        const response = await fetch("/ui", { signal: AbortSignal.timeout(8000) });
        if (!response.ok) throw new Error("ui");
        const data = await response.json();
        dialogs = data.dialogs || [];
        if (stamp === treeStamp && !treePending && !treeWriting) {
          tree = data.tree || { id: "root", name: "", children: [] };
        }
        if (!dialogs.length) {
          const created = await (await fetch("/ui/dialogs", { method: "POST" })).json();
          if (created && created.id) dialogs = [created];
        }
        if (!dialogs.length) throw new Error("ui");
        if (selectStored) {
          const stored = sessionStorage.getItem("dialogId");
          dialogId = dialogs.some((row) => row.id === stored) ? stored : dialogs[0].id;
        } else if (!dialogs.some((row) => row.id === dialogId)) {
          dialogId = dialogs[0].id;
        }
        sessionStorage.setItem("dialogId", dialogId);
        paintChats();
        paintTree();
        uiLoaded = true;
        await selectDialog(dialogId, true);
      } catch (error) {
        if (!uiLoaded) log.replaceChildren(element("p", "muted", "Сервер не ответил"));
        setTimeout(() => loadUi(selectStored), 2000);
      }
    }

    async function selectDialog(id, silent) {
      dialogId = id;
      sessionStorage.setItem("dialogId", dialogId);
      const response = await fetch("/ui/dialogs/" + encodeURIComponent(id));
      const row = await response.json().catch(() => null);
      if (row && row.id) {
        const index = dialogs.findIndex((item) => item.id === row.id);
        if (index >= 0) dialogs[index] = row;
        else dialogs.unshift(row);
      }
      paintChats();
      paintLog();
      if (!silent) setMode("agent");
    }

    async function removeDialog(id) {
      const data = await (await fetch("/ui/dialogs/" + encodeURIComponent(id), { method: "DELETE" })).json();
      dialogs = data.dialogs || [];
      if (!dialogs.length) {
        const created = await (await fetch("/ui/dialogs", { method: "POST" })).json();
        dialogs = [created];
      }
      dialogId = dialogs[0].id;
      sessionStorage.setItem("dialogId", dialogId);
      paintChats();
      await selectDialog(dialogId);
    }

    async function showReady() {
      try {
        const response = await fetch("/ready", { signal: AbortSignal.timeout(4000) });
        if (response.status === 200) {
          systemReady = true;
          readiness.textContent = "Система готова";
          readyDot.classList.add("on");
          if (!treeFresh) {
            treeFresh = true;
            loadUi(false);
          }
          return;
        }
        systemReady = false;
        readyDot.classList.remove("on");
        const data = await response.json().catch(() => ({}));
        if (typeof data.elapsed_sec === "number") {
          readiness.textContent = data.eta_sec == null
            ? "Модель загружается. Прошло " + data.elapsed_sec + " с."
            : "Модель загружается. Прошло " + data.elapsed_sec + " с. Осталось около " + data.eta_sec + " с.";
        } else {
          readiness.textContent = "Модель загружается…";
        }
      } catch (error) {
        readiness.textContent = "Модель загружается…";
        readyDot.classList.remove("on");
      }
      setTimeout(showReady, 2000);
    }

    document.getElementById("fresh").onclick = async () => {

    document.getElementById("find-toggle").onclick = () => {

      if (!open) find.focus();

    function rootMenu(event) {

    log.onclick = (event) => {

    query.addEventListener("keydown", (event) => {

        event.preventDefault();
        ask.requestSubmit();
      }

    function row(file) {
      const box = element("div", "file");
      box.dataset.file = file.name;
      const bar = document.createElement("progress");
      bar.max = 3;
      bar.value = 0;
      box.append(element("div", "", file.name), bar, element("span", "", "загружен"));
      return box;
    }

    function paintStep(name, step, label) {
      const box = [...steps.children].find((child) => child.dataset.file === name);
      if (!box) return;
      box.querySelector("progress").value = step;
      box.querySelector("span").textContent = label;
    }

    async function chooseBase() {
      const targets = await (await fetch("/upload-targets")).json();
      if (!targets.bases.length && !targets.create) return null;
      if (targets.bases.length === 1 && !targets.create) return { kb_id: targets.bases[0].id };
      return await new Promise((resolve) => {
        const wrap = document.createElement("div");
        wrap.id = "pick";
        const form = document.createElement("form");
        form.className = "card";
        const select = document.createElement("select");
        targets.bases.forEach((item) => {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = item.name;
          select.append(option);
        });
        if (targets.create) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "Новая база";
          select.append(option);
        }
        const name = document.createElement("input");
        name.placeholder = "Имя новой базы";
        name.classList.toggle("hidden", select.value !== "");
        select.addEventListener("change", () => name.classList.toggle("hidden", select.value !== ""));
        const ok = document.createElement("button");
        ok.className = "text-btn";
        ok.type = "submit";
        ok.textContent = "Загрузить";
        form.append(field(form, "p", "Куда загрузить"), select, name, ok);
        wrap.append(form);
        document.body.append(wrap);
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          wrap.remove();
          resolve(select.value ? { kb_id: select.value } : { new_name: name.value });
        });
      });
    }

    files.onchange = async () => {
      const chosen = [...files.files];
      const stamp = treeStamp;
      files.value = "";
      if (!chosen.length) return;
      setMode("docs");
      steps.replaceChildren(...chosen.map(row));
      const target = await chooseBase();
      if (!target) {
        steps.append(element("p", "", "Нет базы для загрузки"));
        return;
      }
      const body = new FormData();
      if (target.kb_id) body.append("kb_id", target.kb_id);
      if (target.new_name) body.append("new_name", target.new_name);
      for (const file of chosen) body.append("files", file);
      const request = new XMLHttpRequest();
      request.open("POST", "/upload");
      request.upload.onprogress = (event) => {
        if (!event.lengthComputable) return;
        for (const file of chosen) paintStep(file.name, Math.min(1, event.loaded / event.total), "загружен");
      };
      request.onload = async () => {
        let data = {};
        try { data = JSON.parse(request.responseText); } catch (error) { data = {}; }
        if (request.status !== 200) {
          steps.append(element("p", "", data.detail || "Ошибка загрузки"));
          return;
        }
        for (const file of chosen) paintStep(file.name, 2, "разобран");
        if (data.tree && stamp === treeStamp && !treePending && !treeWriting) tree = data.tree;
        else ensureTreeFiles(data.documents || []);
        paintTree();
        const known = new Set((data.documents || []).map((item) => item.name || item));
        for (const file of chosen) {
          if (known.has(file.name)) paintStep(file.name, 3, "готов к получению вопросов");
        }
      };
      request.onerror = () => steps.append(element("p", "", "Ошибка загрузки"));
      request.send(body);
    };

    ask.onsubmit = async (event) => {
      event.preventDefault();
      const text = query.value.trim();
      if (!text) return;
      const pending = { query: text, answer: "Ответ пишется… 0 с", sources: [], ratings: {} };
      const row = current();
      if (row) {
        row.turns = (row.turns || []).concat([pending]);
        if (!row.title || row.title === "Новый диалог") row.title = text;
      }
      paintChats();
      paintLog();
      query.value = "";
      send.disabled = true;
      const started = Date.now();
      const timer = setInterval(() => {
        pending.answer = "Ответ пишется… " + Math.round((Date.now() - started) / 1000) + " с";
        paintLog();
      }, 1000);
      try {
        const response = await fetch("/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: text, dialog_id: dialogId }),
        });
        const data = await response.json().catch(() => ({}));
        clearInterval(timer);
        if (!response.ok) {
          pending.answer = data.detail || "Ошибка сервера";
          paintLog();
          return;
        }
        pending.answer = data.answer;
        pending.sources = data.sources || [];
        pending.ratings = {
          answer_complete: null,
          answer_correct: null,
          links: {},
          documents: {},
        };
        paintLog();
        await loadUi(false);
      } catch (error) {
        clearInterval(timer);
        pending.answer = "Сервер не ответил";
        paintLog();
      } finally {
        send.disabled = false;
        if (systemReady) {
          readiness.textContent = "Система готова";
          readyDot.classList.add("on");
        }
      }
    };

    const gate = document.getElementById("gate");
    const admin = document.getElementById("admin");
    const adminBody = document.getElementById("admin-body");

    function paintMe(data) {
      me = data;
      document.getElementById("status-login").textContent = data.login || "";
      document.getElementById("status-role").textContent = data.role || "";
      const actions = data.actions || [];
      document.getElementById("manage").classList.toggle("hidden", !actions.length);
      ["users", "roles", "groups", "access", "audit"].forEach((name) => {
        const button = document.getElementById("admin-" + name);
        const need = { users: "manage_users", roles: "manage_roles", groups: "manage_groups", access: "manage_access", audit: "view_audit" }[name];
        button.classList.toggle("hidden", !actions.includes(need));
      });
    }

    async function showGate() {
      const state = await (await fetch("/auth/state")).json();
      document.getElementById("gate-title").textContent = state.has_users ? "Вход" : "Создать администратора";
      document.getElementById("gate-submit").textContent = state.has_users ? "Войти" : "Создать администратора";
      gate.dataset.mode = state.has_users ? "login" : "setup";
      gate.classList.remove("hidden");
      document.getElementById("shell").classList.add("hidden");
    }

    gate.addEventListener("submit", async (event) => {
      event.preventDefault();
      const path = gate.dataset.mode === "setup" ? "/setup" : "/login";
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          login: document.getElementById("gate-login").value,
          password: document.getElementById("gate-password").value,
        }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        document.getElementById("gate-error").textContent = data.detail || "Ошибка";
        return;
      }
      gate.classList.add("hidden");
      document.getElementById("shell").classList.remove("hidden");
      paintMe(data);
      idlePreview();
      showReady();
      loadUi(true);
    });

    document.getElementById("status-out").addEventListener("click", async () => {
      await fetch("/logout", { method: "POST" });
      location.reload();
    });
    document.getElementById("status-password").addEventListener("click", async () => {
      const oldPassword = window.prompt("Прежний пароль", "");
      const newPassword = window.prompt("Новый пароль", "");
      if (!oldPassword || !newPassword) return;
      const response = await fetch("/me/password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ old: oldPassword, new: newPassword }),
      });
      const data = await response.json().catch(() => ({}));
      window.alert(response.ok ? "Пароль изменён" : (data.detail || "Ошибка"));
    });
    document.getElementById("manage").addEventListener("click", () => admin.classList.remove("hidden"));
    document.getElementById("admin-close").addEventListener("click", () => admin.classList.add("hidden"));

    async function showUsers() {
      adminBody.replaceChildren();
      const data = await (await fetch("/admin/users")).json();
      (data.users || []).forEach((user) => field(adminBody, "p", user.login + " — " + user.role + (user.blocked ? " (заблокирован)" : "")));
      const form = document.createElement("form");
      form.className = "card";
      const login = document.createElement("input");
      login.placeholder = "Логин";
      const password = document.createElement("input");
      password.placeholder = "Пароль";
      const role = document.createElement("input");
      role.placeholder = "id роли";
      const ok = document.createElement("button");
      ok.className = "text-btn";
      ok.type = "submit";
      ok.textContent = "Создать";
      form.append(login, password, role, ok);
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const response = await fetch("/admin/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ login: login.value, password: password.value, role_id: role.value }),
        });
        const payload = await response.json().catch(() => ({}));
        field(adminBody, "p", response.ok ? "Создан" : (payload.detail || "Ошибка"));
        if (response.ok) showUsers();
      });
      adminBody.append(form);
    }

    async function showAudit() {
      adminBody.replaceChildren();
      const data = await (await fetch("/admin/audit")).json();
      (data.events || []).forEach((event) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = event.time + " " + event.kind + " " + event.login;
        button.addEventListener("click", async () => {
          const full = await (await fetch("/admin/audit/" + event.id)).json();
          field(adminBody, "pre", JSON.stringify(full, null, 2));
        });
        adminBody.append(button);
      });
    }

    document.getElementById("admin-users").addEventListener("click", showUsers);
    document.getElementById("admin-audit").addEventListener("click", showAudit);
    document.getElementById("admin-roles").addEventListener("click", async () => {
      adminBody.replaceChildren();
      const data = await (await fetch("/admin/roles")).json();
      (data.roles || []).forEach((role) => field(adminBody, "p", role.name + " — " + (role.actions || []).join(", ")));
      field(adminBody, "p", "Действие роли само базу не открывает. Создание базы и «Открыть себе» эту матрицу не меняют.");
    });
    document.getElementById("admin-groups").addEventListener("click", async () => {
      adminBody.replaceChildren();
      const data = await (await fetch("/admin/groups")).json();
      field(adminBody, "p", "Роль в группе — это все, у кого она есть сейчас и будет потом.");
      (data.groups || []).forEach((group) => field(adminBody, "p", group.name));
    });
    document.getElementById("admin-access").addEventListener("click", async () => {
      adminBody.replaceChildren();
      const data = await (await fetch("/admin/kb")).json();
      field(adminBody, "p", "Остальные с вашей ролью эту базу не получат, пока им отдельно не откроют доступ и не включат действия.");
      (data.bases || []).forEach((base) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "text-btn";
        button.textContent = "Открыть себе: " + base.name;
        button.addEventListener("click", async () => {
          const response = await fetch("/admin/kb/" + base.id + "/self", { method: "POST" });
          const payload = await response.json().catch(() => ({}));
          field(adminBody, "p", response.ok ? "Доступ записан" : (payload.detail || "Ошибка"));
        });
        adminBody.append(button);
      });
    });

    async function boot() {
      const response = await fetch("/me");
      if (!response.ok) {
        showGate();
        return;
      }
      paintMe(await response.json());
      idlePreview();
      showReady();
      loadUi(true);
    }
    boot();
  </script>
</body>
</html>
