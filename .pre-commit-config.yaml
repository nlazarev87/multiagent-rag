default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast)
        entry: pytest -m "not slow and not holdout" -q
        language: system
        pass_filenames: false
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: mypy
        name: mypy src/
        entry: mypy src/
        language: system
        pass_filenames: false
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: commit-msg
        name: commit message format
        entry: python scripts/commit_msg.py
        language: system
        pass_filenames: true
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: pre-push
        name: block push to main
        entry: python scripts/block_push_main.py
        language: system
        pass_filenames: false
        stages: [pre-push]
