services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./data/models:/app/data/models:ro
    environment:
      - LLM_MODEL_PATH=/app/data/models/QVikhr-3-1.7B-Instruction-noreasoning-Q4_K_M.gguf
      - EMBED_PATH=/app/data/models/multilingual-e5-small
    restart: unless-stopped
